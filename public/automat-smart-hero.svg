<svg width="820" height="620" viewBox="0 0 820 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f6ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b9def2" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#0f2130" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Soft panel behind -->
  <g opacity="0.75">
    <rect x="190" y="66" width="440" height="488" rx="34" fill="url(#glass)"/>
    <rect x="198" y="74" width="424" height="472" rx="30" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- Vending machine -->
  <g filter="url(#softShadow)">
    <rect x="276" y="128" width="268" height="416" rx="26" fill="url(#metal)" stroke="#e6f1fb" stroke-width="2"/>

    <!-- Header -->
    <text x="410" y="178" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#ffffff" fill-opacity="0.65" letter-spacing="4">
      SMART
    </text>

    <!-- Glass window -->
    <rect x="304" y="202" width="182" height="238" rx="18" fill="#0c1a24" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Product slots -->
    <g opacity="0.95">
      <!-- Row 1 -->
      <rect x="318" y="220" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.28"/>
      <rect x="356" y="220" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.22"/>
      <rect x="394" y="220" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.26"/>
      <rect x="432" y="220" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.20"/>

      <!-- Row 2 -->
      <rect x="318" y="274" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.22"/>
      <rect x="356" y="274" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.28"/>
      <rect x="394" y="274" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.20"/>
      <rect x="432" y="274" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.26"/>

      <!-- Row 3 -->
      <rect x="318" y="328" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.26"/>
      <rect x="356" y="328" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.20"/>
      <rect x="394" y="328" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.28"/>
      <rect x="432" y="328" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.22"/>

      <!-- Row 4 -->
      <rect x="318" y="382" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.20"/>
      <rect x="356" y="382" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.26"/>
      <rect x="394" y="382" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.22"/>
      <rect x="432" y="382" width="32" height="44" rx="8" fill="#fff" fill-opacity="0.28"/>
    </g>

    <!-- Dispenser -->
    <rect x="336" y="456" width="148" height="56" rx="14" fill="#0c1a24" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

    <!-- Payment / keypad column -->
    <rect x="504" y="230" width="18" height="196" rx="9" fill="#0c1a24" fill-opacity="0.18"/>
    <rect x="538" y="248" width="38" height="168" rx="14" fill="#0c1a24" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

    <!-- Keypad dots -->
    <g fill="#ffffff" fill-opacity="0.55">
      <circle cx="552" cy="270" r="3"/>
      <circle cx="564" cy="270" r="3"/>
      <circle cx="576" cy="270" r="3"/>
      <circle cx="552" cy="288" r="3"/>
      <circle cx="564" cy="288" r="3"/>
      <circle cx="576" cy="288" r="3"/>
      <circle cx="552" cy="306" r="3"/>
      <circle cx="564" cy="306" r="3"/>
      <circle cx="576" cy="306" r="3"/>
      <circle cx="552" cy="336" r="3"/>
      <circle cx="564" cy="336" r="3"/>
      <circle cx="576" cy="336" r="3"/>
      <circle cx="552" cy="354" r="3"/>
      <circle cx="564" cy="354" r="3"/>
      <circle cx="576" cy="354" r="3"/>
      <circle cx="552" cy="372" r="3"/>
      <circle cx="564" cy="372" r="3"/>
      <circle cx="576" cy="372" r="3"/>
    </g>

    <!-- NFC / card reader -->
    <rect x="548" y="398" width="18" height="18" rx="5" fill="#ffffff" fill-opacity="0.55"/>
  </g>
</svg>

